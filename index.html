<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>diwali.html</title>
<style>
:root{
  --bg:#1a0b2e; --panel:#24113d; --bar:#2e1650; --line:#3d2266;
  --text:#f6e7c8; --dim:#9d86c4;
  --tag:#ff5c8a; --attr:#ffb627; --str:#8de0a5; --prop:#6fd3ff; --com:#7d6aa3;
  --flame:#ffb627; --glow:#ff7a1a;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Fira Code",ui-monospace,Menlo,Consolas,monospace;line-height:1.7;
  background-image:radial-gradient(circle at 80% 0%,#4a1d6b55,transparent 50%)}
main{max-width:520px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:20px;
  grid-template-columns:1fr}
.win{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;background:var(--bar);padding:8px 12px;
  font-size:.8rem;color:var(--dim);border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%}
.d1{background:#ff5c8a}.d2{background:#ffb627}.d3{background:#8de0a5}
.bar b{margin-left:8px;font-weight:500;color:var(--text)}
pre{margin:0;padding:14px 16px;overflow-x:auto;font:inherit;font-size:.82rem;
  counter-reset:l}
pre span.l{display:block;counter-increment:l;white-space:pre}
pre span.l::before{content:counter(l);display:inline-block;width:2ch;margin-right:2ch;
  text-align:right;color:var(--com)}
.t{color:var(--tag)}.a{color:var(--attr)}.s{color:var(--str)}.p{color:var(--prop)}.c{color:var(--com)}
.who{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);
  font-size:.85rem;color:var(--dim)}
.who input{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);
  border-radius:6px;padding:7px 10px;font:inherit}
.who input:focus-visible{outline:2px solid var(--attr);outline-offset:1px}
.card{text-align:center;padding:28px 20px 30px;
  background:radial-gradient(ellipse at 50% 38%,#ff7a1a33,transparent 60%),var(--panel)}
.diya{position:relative;width:150px;height:96px;margin:30px auto 18px}
.bowl{position:absolute;bottom:0;left:0;width:150px;height:52px;
  background:linear-gradient(#e0771f,#a8420f);border-radius:0 0 75px 75px / 0 0 52px 52px}
.bowl::before{content:"";position:absolute;top:-8px;left:0;right:0;height:16px;
  background:#f0a040;border-radius:50%}
.flame{position:absolute;left:50%;bottom:44px;width:26px;height:48px;margin-left:-13px;
  background:radial-gradient(ellipse at 50% 75%,#fff6d0 10%,var(--flame) 45%,var(--glow) 100%);
  border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;transform-origin:50% 100%;
  box-shadow:0 0 36px 14px #ff7a1a88;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-2deg)}35%{transform:scale(.94,1.08) rotate(2deg)}
  65%{transform:scale(1.04,.95) rotate(-1deg)}}
@media(prefers-reduced-motion:reduce){.flame{animation:none}}
h1{font-size:clamp(1.4rem,5vw,1.9rem);margin:0 0 6px;color:var(--attr);line-height:1.25}
.card p{margin:4px auto;max-width:34ch;font-size:.92rem}
.card p.wish{max-width:38ch;margin:10px auto}
.sig{margin-top:16px;color:var(--str);font-size:.85rem}
.foot{grid-column:1/-1;text-align:center;color:var(--dim);font-size:.8rem}
.snd{display:block;width:calc(100% - 28px);margin:0 14px 10px;padding:10px 14px;cursor:pointer;
  color:var(--text);background:transparent;border:1px solid var(--attr);border-radius:8px;font:inherit;font-size:.9rem}
.snd[hidden]{display:none}
.snd[aria-pressed="true"]{background:#ffb62722}
.snd:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.song{display:block;margin:0 14px 14px;padding:11px 14px;text-align:center;text-decoration:none;
  color:#1a0b2e;background:var(--attr);border-radius:8px;font-weight:600;font-size:.9rem}
.song:hover{background:#ffc94d}
.song:focus-visible{outline:2px solid var(--text);outline-offset:2px}
#gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(26,11,46,.94);padding:24px}
#gate[hidden]{display:none}
#gate button{cursor:pointer;font:inherit;font-size:1.05rem;font-weight:600;color:#1a0b2e;background:var(--attr);
  border:0;border-radius:10px;padding:16px 26px;box-shadow:0 0 40px 8px #ff7a1a66}
#gate button:focus-visible{outline:3px solid var(--text);outline-offset:3px}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
main{position:relative;z-index:1}
</style>
</head>
<body>
<div id="gate"><button id="open" type="button">Tap to open your Diwali wish</button></div>
<canvas id="fw" aria-hidden="true"></canvas>
<main>
  <section class="win" aria-label="Rendered wish">
    <div class="bar"><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i><b>localhost:2026</b></div>
    <div class="card">
      <div class="diya" aria-hidden="true"><div class="flame"></div><div class="bowl"></div></div>
      <h1>Happy Diwali!</h1>
      <p class="wish"><b>To my friends and family:</b> may your days be bright, your laughs be loud, and your home be full of sweets and love.</p>
      <p class="wish">May Lakshmi bring you health, peace and prosperity this year. Thank you for being my light.</p>
      <div class="sig">Shubh Deepavali 🪔</div>
    </div>
    <button id="snd" class="snd" type="button" aria-pressed="false" hidden>Fireworks sound: off</button>
    <a class="song" href="https://soundcloud.com/kpsajan180/mere-tumhare-sabke-liye-happy" target="_blank" rel="noopener noreferrer">Play the Diwali song on SoundCloud</a>
  </section>

</main>
